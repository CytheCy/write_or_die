<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write or Die</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="editor-container">
            <img src="assets/desk.png" id="desk-bg" alt="" aria-hidden="true">
            <div id="typewriter-wrapper">
                <div id="paper-area">
                    <textarea id="writer" placeholder="Start typing to begin..."></textarea>
                </div>
                <img src="assets/typewriter_green.png" id="typewriter-img" alt="Typewriter">
            </div>
            <div id="control-bar" aria-label="Game controls">
                <button class="control-btn">in20xx.com</button>
                <button class="control-btn">Slow</button>
                <button class="control-btn">Medium</button>
                <button class="control-btn">Fast</button>
                <button class="control-btn">10 Minutes</button>
                <button class="control-btn">15 Minutes</button>
                <button class="control-btn">30 Minutes</button>
                <button class="control-btn">60 Minutes</button>
                <button class="control-btn" id="wordCountBtn">Word Count: <span id="wordCount">0</span></button>
                <button class="control-btn" id="copyBtn">Copy Text</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
