<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write or Die</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-container">
        <!-- Game Window -->
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Writing Window with Typewriter -->
        <div id="editor-container">
            <div id="typewriter-wrapper">
                <!-- Paper that sits behind the typewriter -->
                <div id="paper-area">
                    <textarea id="writer" placeholder="Start typing to begin..."></textarea>
                </div>
                <!-- The Typewriter Image -->
                <img src="assets/typewriter.png" id="typewriter-img" alt="Typewriter">
            </div>
            <div id="stats">Words: <span id="wordCount">0</span></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>

</html>
