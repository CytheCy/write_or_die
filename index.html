<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write or Die</title>
    <meta name="description" content="A free browser game where you can train to write and silence the inner critic.">
    <meta property="og:title" content="Write or Die">
    <meta property="og:description" content="A free browser game where you can train to write and silence the inner critic.">
    <meta property="og:image" content="https://writeordie.in20xx.com/assets/preview.jpg">
    <meta property="og:image:secure_url" content="https://writeordie.in20xx.com/assets/preview.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://writeordie.in20xx.com">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Write or Die">
    <meta name="twitter:description" content="A free browser game where you can train to write and silence the inner critic.">
    <meta name="twitter:image" content="https://writeordie.in20xx.com/assets/preview.jpg">
    <link rel="icon" type="image/png" sizes="76x76" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="game-container">
            <canvas id="skyCanvas"></canvas>
        </div>
        <div id="game-foreground" aria-hidden="true">
            <canvas id="gameCanvas"></canvas>
            <div id="rip-menu-wrapper">
                <img src="assets/RIP.png" id="rip-overlay" alt="" aria-hidden="true">
                <nav id="rip-hover-menu" aria-label="RIP links">
                    <a class="rip-hover-link" id="shareLink" href="#" aria-controls="share-popup" aria-expanded="false">SHARE</a>
                    <a class="rip-hover-link" href="#contact">CONTACT</a>
                    <a class="rip-hover-link" href="about.html" target="_blank" rel="noopener noreferrer">ABOUT</a>
                </nav>
            </div>
            <img src="assets/explosion.png" id="explosion-overlay" alt="" aria-hidden="true">
            <img src="assets/rose.png" id="rose-overlay" alt="" aria-hidden="true">
        </div>
        <div id="editor-container">
            <div id="desk-bg" aria-hidden="true"></div>
            <div id="typewriter-wrapper">
                <div id="paper-area">
                    <textarea id="writer" placeholder="Select speed...&#10;Select duration...&#10;Start typing to begin game..." autofocus></textarea>
                </div>
                <img src="assets/typewriter.png" id="typewriter-img" alt="Typewriter">
                <div id="save-confirm-overlay" aria-hidden="true">
                    <div id="save-confirm-box" role="dialog" aria-modal="true" aria-labelledby="saveConfirmPrompt">
                        <p id="saveConfirmPrompt">Save your writing first?</p>
                        <div id="save-confirm-actions">
                            <button class="control-btn" id="saveConfirmYesBtn">Yes</button>
                            <button class="control-btn" id="saveConfirmNoBtn">No</button>
                        </div>
                    </div>
                </div>
                <div id="game-over-overlay" aria-hidden="true">
                    <div id="game-over-box" role="dialog" aria-modal="true" aria-labelledby="gameOverPrompt">
                        <p id="gameOverPrompt">You died! Stretch a bit then try again!</p>
                    </div>
                </div>
                <div id="game-win-overlay" aria-hidden="true">
                    <div id="game-win-box" role="dialog" aria-modal="true" aria-labelledby="gameWinPrompt">
                        <p id="gameWinPrompt">You won! Great job!</p>
                    </div>
                </div>
            </div>
            <div id="control-bar" aria-label="Game controls">
                <button class="control-btn control-gap-after-brand" id="in20xxBtn" title="Brought to you by Cy Porter.&#10;Click to check out his speculative sci-fi.">in20xx.com</button>
                <button class="control-btn speed-btn" data-speed="slow" aria-pressed="false">Slow</button>
                <button class="control-btn speed-btn is-selected" data-speed="medium" aria-pressed="true">Medium</button>
                <button class="control-btn control-gap-after-speed speed-btn" data-speed="fast" aria-pressed="false">Fast</button>
                <button class="control-btn time-btn is-selected" data-minutes="10" aria-pressed="true">10 Minutes</button>
                <button class="control-btn time-btn" data-minutes="15" aria-pressed="false">15 Minutes</button>
                <button class="control-btn time-btn" data-minutes="30" aria-pressed="false">30 Minutes</button>
                <button class="control-btn control-gap-after-time time-btn" data-minutes="60" aria-pressed="false">60 Minutes</button>
                <button class="control-btn" id="clockBtn" aria-live="polite">Time Left: <span id="clockDisplay">10:00</span></button>
                <button class="control-btn" id="wordCountBtn">Word Count: <span id="wordCount">0</span></button>
                <button class="control-btn" id="copyBtn">Copy Text</button>
                <button class="control-btn" id="newGameBtn">New Game</button>
            </div>
            <div id="share-popup" aria-hidden="true">
                <div id="share-popup-panel" role="dialog" aria-modal="true" aria-label="Share Write or Die">
                    <button id="share-popup-close" type="button" aria-label="Close share menu">X</button>
                    <!-- AddToAny BEGIN -->
                    <div class="a2a_kit a2a_kit_size_32 a2a_default_style" data-a2a-url="https://writeordie.in20xx.com/" data-a2a-title="Write or Die">
                        <a class="a2a_button_x"></a>
                        <a class="a2a_button_reddit"></a>
                        <a class="a2a_button_facebook"></a>
                        <a class="a2a_button_bluesky"></a>
                        <a class="a2a_button_copy_link"></a>
                    </div>
                    <!-- AddToAny END -->
                </div>
            </div>
        </div>
        <button id="fullscreen-btn" aria-label="Enter fullscreen mode" title="Fullscreen">⛶</button>
    </div>
    <script>
        var a2a_config = a2a_config || {};
        a2a_config.linkurl = "https://writeordie.in20xx.com/";
        a2a_config.linkname = "Write or Die";
    </script>
    <script async src="https://static.addtoany.com/menu/page.js"></script>
    <script src="game.js"></script>
</body>
</html>
